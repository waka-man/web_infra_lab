networks:
  lablan:
    driver: bridge
    ipam:
      config:
        - subnet: 172.26.0.0/24

services:
  web-01:
    build:
      context: ./web
      network: host
    container_name: web-01
    hostname: web-01
    networks:
      lablan:
        ipv4_address: 172.26.0.20
    ports:
      - "2211:22"
      - "8080:80"
    cap_add:
      - NET_ADMIN

  web-02:
    build:
      context: ./web
      network: host
    container_name: web-02
    hostname: web-02
    networks:
      lablan:
        ipv4_address: 172.26.0.12
    ports:
      - "2212:22"
      - "8081:80"

  lb-01:
    build:
      context: ./lb
      network: host
    container_name: lb-01
    hostname: lb-01
    networks:
      lablan:
        ipv4_address: 172.26.0.10
    ports:
      - "2210:22"
      - "8082:80"
      - "4443:443"

  # web-03: Alpine + intentionally vulnerable OpenSSH (CVE-2026-123158).
  # SSH-only, isolated on lablan. See web-alpine/README.md for the full
  # write-up and demonstration script. Do not expose beyond localhost.
  web-03:
    build:
      context: ./web-alpine
      network: host
    container_name: web-03
    hostname: web-03
    networks:
      lablan:
        ipv4_address: 172.26.0.13
    ports:
      - "2213:22"
